<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mt Kenya Hockey - Best Team 2026 Vote</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#0A0F0A}.font-black2{font-family:'Archivo Black',sans-serif}.card{border:2px solid #1a2e1a}.card:hover{border-color:#22c55e;transform:translateY(-3px)} .card{transition:all .2s}</style>
</head>
<body class="text-white">
<nav class="flex justify-between items-center px-4 py-4 bg-black border-b border-green-900 sticky top-0 z-50">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center font-black text-black text-xl">M</div><div><p class="font-black2 text-sm leading-none">MT KENYA HOCKEY</p><p class="text-[11px] text-green-400">COMMUNITY AWARDS 2026</p></div></div>
<span class="bg-green-500 text-black px-3 py-1 rounded-full font-bold text-xs" id="totalVotes">0 Votes</span>
</nav>

<section class="text-center py-8 px-4">
<p class="text-green-400 font-bold text-xs tracking-widest">🏑 VOTE NOW • CLOSES DEC 2026</p>
<h1 class="font-black2 text-4xl md:text-5xl mt-2">BEST TEAM <span class="text-green-500">2026</span></h1>
<p class="text-gray-400 text-sm mt-2">Chagua timu yako bora ya Mt Kenya Hockey. Kura moja tu!</p>
<a href="index.html" class="inline-block mt-4 bg-white text-black px-4 py-2 rounded-full font-bold text-sm">← Back Home</a>
</section>

<div id="teams" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 px-4 pb-10 max-w-6xl mx-auto"></div>

<div id="success" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[100]">
<div class="bg-[#111] border border-green-500 rounded-2xl p-6 text-center max-w-sm w-full">
<div class="text-5xl">✅</div>
<h2 class="font-black2 text-2xl mt-3">ASANTE!</h2>
<p class="text-gray-400 text-sm mt-1" id="successText">Kura yako imehesabiwa.</p>
<button onclick="document.getElementById('success').classList.add('hidden')" class="mt-4 bg-green-500 text-black px-6 py-2 rounded-full font-bold w-full">Sawa</button>
</div>
</div>

<script>
const TEAMS = [
  { name:"VETERANS HC", info:"Mt Kenya League - Veterans", color:"bg-blue-500", text:"text-blue-500", border:"border-blue-500" },
  { name:"Hurricanes", info:"Mt Kenya League" },
  { name:"Meru Hockey Club", info:"Mt Kenya League" },
  { name:"Nanyuki Hockey Club", info:"Mt Kenya League" },
  { name:"Isiolo Hockey Club", info:"Mt Kenya League" },
  { name:"Embu Hockey Club", info:"Mt Kenya League" },
  { name:"Chuka Hockey Club", info:"Mt Kenya League" },
  { name:"Nyeri Hockey Club", info:"Mt Kenya League" },
  { name:"Karatina Hockey Club", info:"Mt Kenya League" },
];

let votes = JSON.parse(localStorage.getItem('mtkenya_votes_2026') || '{}');
let hasVoted = localStorage.getItem('mtkenya_has_voted_2026');

function total(){ return Object.values(votes).reduce((a,b)=>a+b,0); }

function render(){
  document.getElementById('totalVotes').textContent = total() + ' Votes';
  const wrap = document.getElementById('teams');
  wrap.innerHTML = '';
  TEAMS.forEach(t=>{
    const v = votes[t.name] || 0;
    const pct = total() ? Math.round((v/total())*100) : 0;
    const isVet = t.name === "VETERANS HC";
    const badgeColor = t.color || 'bg-green-500';
    const accent = t.text || 'text-green-500';
    const border = isVet ? 'border-blue-500' : '';
    wrap.innerHTML += `
    <div class="card bg-[#111] rounded-2xl p-5 ${border}">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 ${badgeColor} rounded-full flex items-center justify-center font-black text-black text-xl shrink-0">${t.name[0]}</div>
        <div class="flex-1 min-w-0">
          <h3 class="font-black2 text-base leading-tight truncate">${t.name} ${isVet ? '💙' : ''}</h3>
          <p class="text-xs text-gray-400">${t.info}</p>
        </div>
        <span class="font-black2 text-xl ${accent}">${v}</span>
      </div>
      <div class="bg-[#222] h-2 rounded-full mt-4 overflow-hidden"><div class="${badgeColor} h-full" style="width:${pct}%"></div></div>
      <div class="flex justify-between text-xs text-gray-400 mt-1"><span>${pct}%</span><span>${v} votes</span></div>
      <button onclick="vote('${t.name}')" ${hasVoted ? 'disabled' : ''} class="mt-4 w-full py-2.5 rounded-full font-bold text-sm ${hasVoted ? 'bg-gray-700 text-gray-400' : isVet ? 'bg-blue-500 text-white' : 'bg-green-500 text-black'}">${hasVoted ? (localStorage.getItem('mtkenya_my_vote_2026')===t.name ? '✓ YOUR VOTE' : 'VOTING CLOSED') : 'Vote for ' + t.name}</button>
    </div>`;
  });
}

function vote(name){
  if(hasVoted){ alert('Ulisha vote!'); return; }
  votes[name] = (votes[name] || 0) + 1;
  localStorage.setItem('mtkenya_votes_2026', JSON.stringify(votes));
  localStorage.setItem('mtkenya_has_voted_2026', 'yes');
  localStorage.setItem('mtkenya_my_vote_2026', name);
  hasVoted = 'yes';
  document.getElementById('successText').textContent = 'Umevote ' + name + '! Asante sana.';
  document.getElementById('success').classList.remove('hidden');
  render();
}
render();
</script>
</body>
</html>
